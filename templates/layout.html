<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>Techaura 2024</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/style1.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
    <script src="../static/scripts.js" defer></script>
</head>
<body class="parent">
  <nav class="navbar navbar-expand-lg navbar-light bg-translucent" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand ml-3" id="navlogo_text" href="/">
        <img src="../static/images/techaura.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
        Techaura 2024
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" id="navbartoggler"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto mb-2 mb-lg-0 mr-5">
          <li class="nav-item ml-4 mr-4">
            <a class="nav-link" aria-current="page"  id="navlinks" href="/">Home</a>
          </li>
          <li class="nav-item ml-4 mr-4">
            <a class="nav-link"  id="navlinks" href="/events">Events</a>
          </li>
          <li class="nav-item ml-4 mr-4">
            <a class="nav-link"  id="navlinks" href="/gallery">Gallery</a>
          </li>
          <li class="nav-item ml-4 mr-4">
            <a class="nav-link"  id="navlinks" href="/contact">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  {% block body %}{% endblock %}
</body>
</html>
